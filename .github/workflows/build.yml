name: Begonia native Arch engineering build
on:
  push:
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      ssh_public_key:
        description: 'SSH public key for alarm (never a private key)'
        required: true
        type: string
      rootfs_sha256:
        description: 'Expected saved rootfs SHA256; blank means first rolling snapshot'
        required: false
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: bash scripts/check-syntax.sh
  kernel:
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      ROOTFS_SHA256: ${{ inputs.rootfs_sha256 }}
      SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
      FETCH_ROOTFS: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make gcc bison flex libssl-dev libelf-dev bc python3 zstd cpio libarchive-tools e2fsprogs kmod device-tree-compiler mkbootimg openssh-client
      - name: Fetch pinned sources (Arch input only for image builds)
        run: bash scripts/fetch-sources.sh
      - name: Cross-check boot packaging
        run: python3 scripts/test-aosp-packaging.py
      - name: Compile kernel and matching DTB
        run: bash scripts/build-kernel.sh
      - name: Build headless Arch images
        if: github.event_name == 'workflow_dispatch'
        run: |
          printf '%s\n' "$SSH_PUBLIC_KEY" > inputs/authorized_keys
          sudo bash scripts/build-rootfs.sh
          sudo bash scripts/build-boot.sh
      - name: Preserve input snapshot for repeat builds
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: official-arch-input-${{ github.run_id }}
          path: |
            inputs/ArchLinuxARM-aarch64.tar.gz
            inputs/SHA256SUMS
          retention-days: 30
          compression-level: 0
      - name: Build output and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: begonia-engineering-${{ github.run_id }}
          path: |
            out/
            logs/
          retention-days: 30
          compression-level: 1
          if-no-files-found: error
